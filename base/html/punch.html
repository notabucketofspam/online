<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
<link rel="stylesheet" type="text/css" href="/css/great-scott.css"/>
<meta name="viewport" content="width=device-width, user-scalable=yes"/>
<title>Punch - waluigi-servebeer.com</title>
<style>
  .notice-me {
    font-variant: small-caps;
    text-align: center;
  }

  ol#plist {
    padding-left: 0;
  }

  li.service {
    border: 1px solid black;
    padding: 3px;
    list-style-type: none;
    max-width: 5in;
    overflow-x: visible;
    margin-bottom: 3px;
  }

    li.service > ul {
      padding-left: 20px;
      margin: 0;
    }

    li.service > button {
      display: block;
      margin: 0 auto;
      width: 90%;
    }
      li.service > button::before {
        content: '\2B06\FE0F';
      }

  ul#trusted_users {
    margin: 0;
    padding: 0;
  }

    ul#trusted_users > li {
      list-style-type: none;
    }

      ul#trusted_users > li > button {
        margin-right: 5px;
        display: inline-block;
        width: 21px;
        height: 21px;
        padding: 0;
      }

  #trust_sidebar {
    float: right;
    max-width: fit-content;
    border: 3px double black;
    padding: 3px;
  }

  @media (max-width: 8in) {
    #trust_sidebar {
      float: none;
    }
  }
</style>
</head>
<body>
<div class="sef lard">
<h1 class="notice-me">Punch</h1>

<div class="lube" id="ip_addresses">
  <div>Your IPv4 address is <b id="your_ipv4">0.0.0.0</b></div>
  <div>Your IPv6 address is <b id="your_ipv6">::</b></div>
</div>

<div id="trust_sidebar">
  <div id="logged_in_as">Not logged in</div>
  <hr/>
  <div id="trust_stuff">
    <span>Here are the users that you trust:</span>
    <ul id="trusted_users"></ul>
    <hr/>
    <div>
      Add a trusted user:
      <br/>
      <form id="form_addTrust">
        <label>
          <input autocomplete="country-name" required name="trustee" type="text" maxlength="50" placeholder="username" />
        </label>
        <br/>
        <button type="submit">Submit</button>
      </form>
    </div>
  </div>
</div>

<ol id="plist"></ol>

</div>
<!-- end of the main stuff -->

<script src="/js/everything.js"></script>
<script>
  check_online(async (jazz) => {
    var logged_in_as = document.getElementById("logged_in_as");
    if (jazz.username) {
      logged_in_as.innerHTML = `Logged in as <b>${jazz.username}</b>`;
      await showTrusts();
    } else {
      document.getElementById("trust_stuff").setAttribute("hidden", '');
    }
  });

  // =================================
  // HARVEY DENT CAN WE TRUST HIM?

  var trusts = [];

  /**
    who do you trust?
  */
  async function showTrusts () {
    const trusted_users = document.getElementById('trusted_users');
    const the_store = await get_storage();
    trusts = the_store['storage']['trusts'] || [''];
    const insertable = trusts.map(write_trustee).join('');
    trusted_users.insertAdjacentHTML('beforeend', insertable);
  }

  function write_trustee (name) {
    return `<li id="trust_${name}"><button onclick="untrust('${name}')"><b>&#x1F5D1;&#xFE0F;</b></button> <span>${name}</span></li>`
  }

  var form_addTrust = document.getElementById("form_addTrust");
  form_addTrust.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const input = document.querySelector('#form_addTrust input[name="trustee"]');
    const trustee = input.value;
    if (!trusts.includes(trustee)) {
      trusts.push(trustee);
      const trusted_users = document.getElementById('trusted_users');
      trusted_users.insertAdjacentHTML('beforeend', write_trustee(trustee));
      await post_storage({trusts});
      alert_II("I'm glad you have people in your life you can trust.");
    } else {
      alert_II("You can't double-trust someone.");
    }
    form_addTrust.reset();
  });

  async function untrust (name) {
    var thatsHimOfficer = document.getElementById(`trust_${name}`);
    thatsHimOfficer.remove();
    trusts = trusts.filter((x) => x !== name);
    await post_storage({trusts});
    alert_II(`<span style="white-space:nowrap;">It's a shame things didn't work out between you two.</span>`);
  }

  // ==================================
  // all of this stuff below is what actually does punch

  var useLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '';

  /**
  Display the IP address of the user
  */
  async function writeIpAddr () {
    if (useLocalhost) {
      // we are at home, feeling cozy
      var addr_real = (await (await fetch("/ip")).text());
      var which_fam = 4;
      if (addr_real.includes(':')) {
        which_fam = 6;
      }
      var your_ipvx = document.getElementById(`your_ipv${which_fam}`);
      your_ipvx.innerText = addr_real;
    } else {
      // we are surfing the world wide web
      var addr_v4 = (await (await fetch(`https://4.${window.location.hostname}`, {
        cache: 'no-store',
        mode: 'cors'
      })).text());
      var your_ipv4 = document.getElementById("your_ipv4");
      your_ipv4.innerText = addr_v4;

      var addr_v6 = (await (await fetch(`https://6.${window.location.hostname}`, {
        cache: 'no-store',
        mode: 'cors'
      })).text());
      var your_ipv6 = document.getElementById("your_ipv6");
      your_ipv6.innerText = addr_v6;
    }
  }
  writeIpAddr();

  /**
  @typedef Punch
    @prop {string} addr the IP address for someone
    @prop {number} port this is the port for the service that client wants to advertise (ex: 2302)
    @prop {string} serviceName this is the name of the server, for display purposes
    @prop {string} username Who posted this?
  */

  /**
  Get the punch list
  */
  async function getPunchList () {
    const plist = document.getElementById("plist");
    const res = await fetch('/api/punch/list');
    if (res.ok) {
      /** @type Punch[] */
      let all_services = await res.json();
      //cog(all_services);

      // actually putting pen to paper here
      if (all_services.length === 0) {
        plist.innerHTML = '<li>sorry nothing</li>';
      } else {
        var services_html = all_services.map(makeServiceListing).join('');
        plist.innerHTML = services_html;
      }

    } else {
      // res is *not* ok
      plist.innerHTML = await res.text();
    }
  }
  getPunchList();

  /**
  @param {Punch} punch
  */
  function makeServiceListing (punch) {
    var service = `
    <li class='service'>
      <ul>
        <li>Address: ${punch.addr}</li>
        <li>Port: ${punch.port}</li>
        <li>ServiceName: ${punch.serviceName}</li>
        <li>username: ${punch.username}</li>
      </ul>
      <button onclick="pleaseLetMeJoin('${punch.addr}',${punch.port},'${punch.serviceName}','${punch.username}')">Connect</button>
    </li>
    `;
    return service;
  }

  /**
  @param {string} addr
  @param {number} port
  @param {string} serviceName
  @param {string} username
  */
  async function pleaseLetMeJoin (addr, port, serviceName, username) {
    /**@type Punch*/
    const punch = {addr, port, serviceName, username};
    var contentType = useLocalhost ? 'application/json' : 'text/plain';
    var base_url = useLocalhost ? '' : `${window.location.protocol}//${punch.addr.includes(":") ? 6 : 4}.${window.location.hostname}`;
    var fetch_url = base_url + '/api/punch/join';

    const res = await fetch(fetch_url, {
      method: 'POST',
      headers: {'Content-Type': contentType},
      body: JSON.stringify(punch)
    });
    if (res.ok) {
      const resdat = await res.json();
      console.log(resdat);
      alert_II('ok');
    } else {
      let restext = await res.text();
      console.log(restext);
      alert_II(restext);
    }
  }
</script>
</body>
</html>
