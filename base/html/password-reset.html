<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" type="text/css" href="/css/great-scott.css"/>
	<meta name="viewport" content="width=device-width, user-scalable=yes"/>
	<title>Password reset - waluigi-servebeer.com</title>
	<style>
		form > label {
			display: block;
			margin: 8px 0px;
		}
		label > span{
			line-height:0;
		}
	</style>
</head>
<body>
<div class="sef lard">
	<h1 style="text-align:center;">Password Reset</h1>
	<form id="password_reset" style="justify-items:end;" class="lube lard">
		<label>
			Your email address:
			<input type="email" name="email" maxlength="100" required autocomplete="on" placeholder="Enter your email" />
		</label>
		<label>
			Some kinda <em>new password</em>:
			<input type="password" name="newpassword" required autocomplete="new-password" minlength="1" maxlength="128" placeholder="your new password" />
		</label>
		<label>
			<span>the <strong>password reset<br/>token</strong> included with<br/>the email that you got:</span>
			<input type="text" name="token" required autocomplete="off" minlength="16" maxlength="16" placeholder="the password reset token" />
		</label>
		<p><button type="submit">the submit button :^)</button></p>
	</form>
</div>
<script src="/js/everything.js"></script>
<script>
	document.getElementById("password_reset").addEventListener('submit', async function (event) {
		event.preventDefault();

		const email = document.querySelector('#password_reset [name="email"]').value;
		const password = document.querySelector('#password_reset [name="newpassword"]').value;
		const token = document.querySelector('#password_reset [name="token"]').value;

		try {
			const response = await fetch('/api/users/password-reset', {
				method: 'POST',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify({ email, password, token })
			});
			if (response.ok) {
				alert("Success! Your password has been reset. You can now log in with your new password.");
				document.getElementById('password_reset').reset(); // Clear the form
				goto_smart('/login/');
			} else {
				const errorData = await response.json();
				alert('FAIL: ' + (errorData.message || 'Unknown error'));
			}
		} catch (err) {
			console.error(err);
			alert("Error: " + err.message);
		}
	});
</script>
</body>
</html>
