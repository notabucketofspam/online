<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml">
<head><meta charset="utf-8" />
<link rel="stylesheet" type="text/css" href="/css/great-scott.css"/>
<meta name="viewport" content="width=device-width, user-scalable=yes"/>
<title>LiveKit Chat - waluigi-servebeer.com</title>
<style>
#everyone-is-here *{
margin:0;
}
.logged-in-as {
  border-style:double;
  border-color:#000;
  border-width:3px;
  max-width:min-content;
  padding:2px;
  float:right;
}
	@media (max-width:400px) {
		.logged-in-as {
			float: none;
			margin: 0 auto;
			margin-bottom: 10px;
		}
	}
</style>
</head>
<body>

<div class="sef lard" id="livekit-platter">
  <h1>LiveKit Chat</h1>
  <div>
    <div id="lobby-view">
      <input type="text" id="roomcode-input" placeholder="Enter room code" value="general-chat"/>
      <button id="join-btn">Join Voice</button>
    </div>

    <div id="active-call-view" style="display: none;">
      <div class="call-header">
        <span id="current-room-title">Connected to: None</span>
        <button id="leave-btn">Disconnect</button>
      </div>
      <div id="everyone-is-here">
        <h4>People in Channel</h4>
        <ul id="participant-list"></ul>
      </div>
    </div>

    <hr/>

    <div>
      <button id="loadactiverooms">Load Active Rooms</button>
      <div id="room-list-container"></div>
    </div>
  </div>

  <div id="audio-container"></div>
</div>

<script src="/js/everything.js"></script>
<script src="/livekit/lk-front.js" type="module"></script>
<script src="/livekit/winmedia.js"></script>
<script>
  check_online(function (jazz) {
    if (jazz.username) {
			var loggedInDiv = document.createElement('div');
			loggedInDiv.innerHTML = `Logged in as <div><b>${jazz.username}</b><div>`;
			loggedInDiv.className = 'logged-in-as';
			document.getElementById('livekit-platter').prepend(loggedInDiv);
    }
  });
</script>
</body>
</html>
